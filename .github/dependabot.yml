# Fase 6 hardening — auto-avisa (PRs) de updates con CVEs en deps.
# Semanal para no inundar; agrupa los minor/patch para reducir ruido.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    # Ignoramos TODOS los major version bumps: cada major (React 19, Next 16,
    # Tailwind 4, TS 6, ESLint 10, etc.) necesita una migración dedicada y
    # decidida, no un auto-PR que rompe el preview y genera ruido/emails.
    # Siguen llegando minor/patch (agrupados) + parches de seguridad.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
