# Dependabot — postura "SOLO SEGURIDAD" (decisión 2026-06-09).
#
# La activación inicial drenó el backlog con muchos majors → ráfaga de previews
# fallidos + comentarios de bots → ruido de emails. Dejamos
# open-pull-requests-limit en 0: NO abre PRs de updates rutinarios (ni
# minor/patch ni major). Las actualizaciones de SEGURIDAD (Dependabot security
# updates, que se controlan en repo Settings → Code security & analysis) SÍ
# pueden abrir PR — eso es lo único importante y queremos recibirlo.
# Los updates rutinarios se hacen a mano cuando se decida.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
