name: Follow-update notifications (daily)

# Sprint RA-3 — Corre 1 vez al día a las 13:00 UTC (09:00 Santiago verano,
# 10:00 invierno). Lee dj_update_events sin notificar, agrupa por DJ y
# manda un email digest a cada follower con notify_email=true.
#
# Setup necesario (mismos secrets que los otros workflows):
# - GitHub secret CRON_SECRET
# - GitHub secret APP_URL = https://jayportu-manager-os.vercel.app

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit follow-updates cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL o CRON_SECRET no configurados en GitHub Secrets"
            exit 1
          fi

          echo "Calling $APP_URL/api/follow-updates/cron"
          HTTP_CODE=$(curl -s -o /tmp/follow-updates-response.json -w "%{http_code}" \
            -X GET "$APP_URL/api/follow-updates/cron" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 120)

          echo "HTTP $HTTP_CODE"
          echo "--- Response ---"
          cat /tmp/follow-updates-response.json
          echo ""

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::follow-updates cron failed with status $HTTP_CODE"
            exit 1
          fi
