name: Backup Supabase (weekly)

# Corre 1 vez por semana — domingos 06:00 UTC (2/3am Santiago).
# Hace pg_dump del schema public de Supabase y guarda el resultado:
#   1. Como GitHub Artifact (retención 90 días, fácil de descargar)
#   2. Pusheado al repo privado `jayportu_Manager_OS_backups` (retención infinita)
#
# Requiere los secrets:
#   - DATABASE_URL          connection string completa de Supabase Postgres
#   - BACKUP_REPO_TOKEN     fine-grained PAT con Contents:R/W sobre el repo de backups

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch: {}

env:
  BACKUP_REPO: jayportu/jayportu_Manager_OS_backups

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL 16 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL no configurado en secrets"
            exit 1
          fi
          if ! printf '%s' "$DATABASE_URL" | grep -Eq '^postgres(ql)?://'; then
            echo "::error::DATABASE_URL no empieza con postgres:// o postgresql://. Revisa el secret en GitHub — debe ser SOLO el connection string, sin el prefijo 'DATABASE_URL=' ni comillas."
            exit 1
          fi

          DATE=$(date -u +%Y-%m-%d)
          FILE="backup-${DATE}.sql"
          echo "Dumping to $FILE"

          # --no-owner / --no-acl: dumps portables, sin owners ni roles
          # --schema=public: solo schema público (no auth, storage, etc — son de Supabase)
          # --clean / --if-exists: el restore borra antes de recrear
          pg_dump "$DATABASE_URL" \
            --no-owner --no-acl \
            --schema=public \
            --clean --if-exists \
            > "$FILE"

          gzip "$FILE"
          ls -la "${FILE}.gz"

          # Variables para próximos steps
          echo "DUMP_FILE=${FILE}.gz" >> $GITHUB_ENV
          echo "BACKUP_DATE=$DATE" >> $GITHUB_ENV

      - name: Upload as GitHub Artifact (90d retention)
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ env.BACKUP_DATE }}
          path: ${{ env.DUMP_FILE }}
          retention-days: 90

      - name: Push to private backup repo
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_DATE: ${{ env.BACKUP_DATE }}
          DUMP_FILE: ${{ env.DUMP_FILE }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::BACKUP_REPO_TOKEN no configurado en secrets"
            exit 1
          fi

          git config --global user.name "backup-bot"
          git config --global user.email "backup-bot@users.noreply.github.com"

          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ env.BACKUP_REPO }}.git"
          YEAR=$(echo "$BACKUP_DATE" | cut -d- -f1)
          WORK=../backup-repo

          # Intenta clonar el repo. Si está vacío (sin commits) el clone
          # imprime warning pero crea un repo vacío local — lo manejamos
          # inicializándolo nosotros.
          git clone "$REPO_URL" "$WORK" 2>&1 | tee /tmp/clone.log || true

          if [ ! -d "$WORK/.git" ]; then
            echo "::error::Clone falló completamente"
            cat /tmp/clone.log
            exit 1
          fi

          cd "$WORK"

          # Si no hay commits, inicializar README + estructura
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "Repo vacío — inicializando con README"
            printf '%s\n' '# JAY Manager OS — Backups' '' 'Dumps semanales del schema `public` de la DB de Supabase.' '' 'Generados automaticamente por el workflow `backup-weekly.yml` del repo publico `jayportu_Manager_OS`, los domingos a las 06:00 UTC.' '' '## Estructura' '' '- `dumps/YYYY/backup-YYYY-MM-DD.sql.gz` — pg_dump comprimido' '' '## Como restaurar' '' '```bash' 'gunzip dumps/2026/backup-2026-05-23.sql.gz' 'psql "$DATABASE_URL" -f dumps/2026/backup-2026-05-23.sql' '```' '' 'Los dumps usan `--clean --if-exists` para que el restore sea idempotente.' > README.md
            git checkout -b main 2>/dev/null || git checkout main
            git add README.md
            git commit -m "Initial commit (auto)"
          fi

          mkdir -p "dumps/${YEAR}"
          cp "../../${DUMP_FILE}" "dumps/${YEAR}/" 2>/dev/null \
            || cp "$GITHUB_WORKSPACE/${DUMP_FILE}" "dumps/${YEAR}/"
          git add "dumps/${YEAR}/${DUMP_FILE}"

          if git diff --cached --quiet; then
            echo "No hay cambios — backup ya existía con este nombre"
            # Si solo había README nuevo, igualmente push
            if git log origin/main..HEAD 2>/dev/null | grep -q commit; then
              git push origin HEAD:main
            fi
            exit 0
          fi

          git commit -m "Backup ${BACKUP_DATE}"
          git push origin HEAD:main
          echo "Push OK"
