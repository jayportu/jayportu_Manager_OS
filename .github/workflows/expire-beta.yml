name: Expire beta users daily

# Corre 1 vez al día a las 12:00 UTC (08:00 Santiago verano, 09:00 invierno).
# Busca beta users cuyo beta_approved_at + 15 días ya pasó y los marca
# como expired. Manda email de aviso vía Resend.
#
# Setup necesario (mismos secrets que los otros workflows):
# - GitHub secret CRON_SECRET
# - GitHub secret APP_URL = https://jayportu-manager-os.vercel.app

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit expire-cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL o CRON_SECRET no configurados en GitHub Secrets"
            exit 1
          fi

          echo "Calling $APP_URL/api/beta/expire-cron"
          HTTP_CODE=$(curl -s -o /tmp/expire-response.json -w "%{http_code}" \
            -X GET "$APP_URL/api/beta/expire-cron" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 120)

          echo "HTTP $HTTP_CODE"
          echo "--- Response ---"
          cat /tmp/expire-response.json
          echo ""

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Expire-beta cron failed with status $HTTP_CODE"
            exit 1
          fi
