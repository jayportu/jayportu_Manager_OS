name: Sync Growth platforms (daily)

# Corre 1 vez al día a las 12:00 UTC (9am Santiago en horario CLT, 8am en CLST).
# Llama al endpoint /api/growth/sync-cron protegido con CRON_SECRET.
# Crea snapshots automáticos de SoundCloud (followers, tracks, likes).
#
# Setup necesario (mismos secrets que sync-calendar.yml):
# - GitHub secret CRON_SECRET
# - GitHub secret APP_URL = https://jayportu-manager-os.vercel.app

on:
  schedule:
    # 12:00 UTC todos los días (9am Santiago verano, 8am invierno)
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit growth sync endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL o CRON_SECRET no configurados en GitHub Secrets"
            exit 1
          fi

          echo "Calling $APP_URL/api/growth/sync-cron"
          HTTP_CODE=$(curl -s -o /tmp/sync-response.json -w "%{http_code}" \
            -X POST "$APP_URL/api/growth/sync-cron" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 120)

          echo "HTTP $HTTP_CODE"
          echo "--- Response ---"
          cat /tmp/sync-response.json
          echo ""

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Sync failed with status $HTTP_CODE"
            exit 1
          fi
